services:
  mc:
    image: itzg/minecraft-server:java8-openj9
    environment:
      TYPE: CURSEFORGE
      MEMORY: 10G
      JVM_OPTS: "-Xmx10G -Xms4G"  # Setze JVM Speicherzuweisungen
      CF_SLUG: "create-above-and-beyond"
      CF_SLUG_VERSION: "1.3"
      CF_API_KEY: ${CF_API_KEY}
      CF_SERVER_MOD: 3567576
      MOTD: |-
        §1§lFurz24.de
        §7powered by §6henk.pm
      OPS: |
        Zurki
      VERSION: 1.20.1
      EULA: "true"
    ports:
      - "25565:25565"
    volumes:
      - data:/data
    stdin_open: true
    tty: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 12g  # Container Speicherlimit
          cpus: "8"   # CPU Limit
volumes:
  data: {}
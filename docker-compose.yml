services:
  mc:
    image: itzg/minecraft-server:java21
    environment:
      SEED: "-123456793079414942"
      TYPE: AUTO_CURSEFORGE
      MEMORY: 10G
      JVM_OPTS: "-Xmx10G -Xms4G"  # Setze JVM Speicherzuweisungen
      CF_PAGE_URL: ${CF_PAGE_URL}
      CF_API_KEY: ${CF_API_KEY}
      MOTD: |-
        §1§lFurz24.de
        §7powered by §6henk.pm
      ALLOW_FLIGHT: TRUE
      OPS: |
        Zurki
      VERSION: 1.21.1
      EULA: "true"
      CF_EXCLUDE_MODS: "forgeskyboxes"
      CF_FORCE_SYNCHRONIZE: "true"
    ports:
      - "25575:25575"
      - "25565:25565"
    volumes:
      - data:/data
    stdin_open: true
    tty: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 12g  # Container Speicherlimit
          cpus: "8"   # CPU Limit
volumes:
  data: {}

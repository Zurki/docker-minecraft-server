services:
  mc:
    image: itzg/minecraft-server:java21
    environment:
      SEED: "-123456793079414942"
      TYPE: AUTO_CURSEFORGE
      JVM_OPTS: "-Xmx10G -Xms4G"
      CF_PAGE_URL: ${CF_PAGE_URL}
      CF_API_KEY: ${CF_API_KEY}
      MOTD: |-
        §1§lFurz24.de
        §7powered by §6henk.pm
      ALLOW_FLIGHT: TRUE
      OPS: |
        Zurki
      VERSION: 1.21.1
      EULA: "true"
      # KORREKTUR: "iris" entfernt. Nur colorwheel und forgeskyboxes bleiben.
      MODS: "chunky,spark,simple-backups,luckperms"
      CF_EXCLUDE_MODS: "forgeskyboxes,colorwheel"
      # Wir lassen Synchronize auf false, um Boot-Loops zu vermeiden,
      # falls wir gleich manuell löschen müssen.
      CF_FORCE_SYNCHRONIZE: "false"
    ports:
      - "25575:25575"
      - "25565:25565"
    volumes:
      - data:/data
    stdin_open: true
    tty: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 12g
          cpus: "8"

volumes:
  data: {}
